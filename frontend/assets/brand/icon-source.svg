<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fondo Sapphire 3D -->
    <radialGradient id="bgRadial" cx="38%" cy="28%" r="72%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2456b8"/>
      <stop offset="45%"  stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0e1f4d"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050a1e" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Pala — blanco metálico Sapphire-tinted -->
    <linearGradient id="paddleGrad" x1="120" y1="80" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#dbeafe"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <!-- Curvas Azure pelota -->
    <linearGradient id="curveLeft" x1="80" y1="180" x2="240" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#60A5FA"/>
      <stop offset="70%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curveRight" x1="430" y1="180" x2="270" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#60A5FA"/>
      <stop offset="70%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="curveGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <!-- Mascara para agujeros — patron hexagonal denso -->
    <mask id="holesMask">
      <rect x="0" y="0" width="200" height="200" fill="white"/>
      <!-- ~50 agujeros en patrón hexagonal — filas alternadas con offset -->
      <!-- Fila 1 (y=30) - 3 agujeros -->
      <circle cx="78"  cy="30" r="4.2" fill="black"/>
      <circle cx="100" cy="30" r="4.2" fill="black"/>
      <circle cx="122" cy="30" r="4.2" fill="black"/>
      <!-- Fila 2 (y=44) offset - 4 -->
      <circle cx="67"  cy="44" r="4.2" fill="black"/>
      <circle cx="89"  cy="44" r="4.2" fill="black"/>
      <circle cx="111" cy="44" r="4.2" fill="black"/>
      <circle cx="133" cy="44" r="4.2" fill="black"/>
      <!-- Fila 3 (y=58) - 5 -->
      <circle cx="56"  cy="58" r="4.2" fill="black"/>
      <circle cx="78"  cy="58" r="4.2" fill="black"/>
      <circle cx="100" cy="58" r="4.2" fill="black"/>
      <circle cx="122" cy="58" r="4.2" fill="black"/>
      <circle cx="144" cy="58" r="4.2" fill="black"/>
      <!-- Fila 4 (y=72) offset - 6 -->
      <circle cx="45"  cy="72" r="4.2" fill="black"/>
      <circle cx="67"  cy="72" r="4.2" fill="black"/>
      <circle cx="89"  cy="72" r="4.2" fill="black"/>
      <circle cx="111" cy="72" r="4.2" fill="black"/>
      <circle cx="133" cy="72" r="4.2" fill="black"/>
      <circle cx="155" cy="72" r="4.2" fill="black"/>
      <!-- Fila 5 (y=86) - 7 -->
      <circle cx="34"  cy="86" r="4.2" fill="black"/>
      <circle cx="56"  cy="86" r="4.2" fill="black"/>
      <circle cx="78"  cy="86" r="4.2" fill="black"/>
      <circle cx="100" cy="86" r="4.2" fill="black"/>
      <circle cx="122" cy="86" r="4.2" fill="black"/>
      <circle cx="144" cy="86" r="4.2" fill="black"/>
      <circle cx="166" cy="86" r="4.2" fill="black"/>
      <!-- Fila 6 (y=100) offset - 6 -->
      <circle cx="45"  cy="100" r="4.2" fill="black"/>
      <circle cx="67"  cy="100" r="4.2" fill="black"/>
      <circle cx="89"  cy="100" r="4.2" fill="black"/>
      <circle cx="111" cy="100" r="4.2" fill="black"/>
      <circle cx="133" cy="100" r="4.2" fill="black"/>
      <circle cx="155" cy="100" r="4.2" fill="black"/>
      <!-- Fila 7 (y=114) - 5 -->
      <circle cx="56"  cy="114" r="4.2" fill="black"/>
      <circle cx="78"  cy="114" r="4.2" fill="black"/>
      <circle cx="100" cy="114" r="4.2" fill="black"/>
      <circle cx="122" cy="114" r="4.2" fill="black"/>
      <circle cx="144" cy="114" r="4.2" fill="black"/>
      <!-- Fila 8 (y=128) offset - 4 -->
      <circle cx="67"  cy="128" r="4.2" fill="black"/>
      <circle cx="89"  cy="128" r="4.2" fill="black"/>
      <circle cx="111" cy="128" r="4.2" fill="black"/>
      <circle cx="133" cy="128" r="4.2" fill="black"/>
      <!-- Fila 9 (y=142) - 3 -->
      <circle cx="78"  cy="142" r="4.2" fill="black"/>
      <circle cx="100" cy="142" r="4.2" fill="black"/>
      <circle cx="122" cy="142" r="4.2" fill="black"/>
    </mask>
  </defs>

  <!-- CAPA 1+2: Squircle Sapphire 3D + vignette -->
  <path d="M256 18 C190 18 148 18 112 42 C76 66 42 100 28 148 C18 180 18 210 18 256 C18 302 18 332 28 364 C42 412 76 446 112 470 C148 494 190 494 256 494 C322 494 364 494 400 470 C436 446 470 412 484 364 C494 332 494 302 494 256 C494 210 494 180 484 148 C470 100 436 66 400 42 C364 18 322 18 256 18Z" fill="url(#bgRadial)"/>
  <path d="M256 18 C190 18 148 18 112 42 C76 66 42 100 28 148 C18 180 18 210 18 256 C18 302 18 332 28 364 C42 412 76 446 112 470 C148 494 190 494 256 494 C322 494 364 494 400 470 C436 446 470 412 484 364 C494 332 494 302 494 256 C494 210 494 180 484 148 C470 100 436 66 400 42 C364 18 322 18 256 18Z" fill="url(#vignette)"/>

  <!-- CAPA 3: Bevel arcos de luz -->
  <path d="M256 26 C194 26 155 26 121 48 C87 70 55 102 40 148 C30 178 28 206 28 256" stroke="rgba(255,255,255,.18)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M380 38 C420 58 452 92 470 140 C484 178 486 208 486 256" stroke="rgba(255,255,255,.08)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- CAPA 4+5: Curvas Azure pelota (3 capas cada una) -->
  <path d="M 95 390 C 100 310 130 240 180 195 C 210 168 236 155 256 152" stroke="rgba(96,165,250,.35)" stroke-width="22" stroke-linecap="round" fill="none" filter="url(#curveGlow)"/>
  <path d="M 95 390 C 100 310 130 240 180 195 C 210 168 236 155 256 152" stroke="url(#curveLeft)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 97 386 C 102 307 132 237 182 192 C 212 165 238 153 256 150" stroke="rgba(255,255,255,.28)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <path d="M 417 390 C 412 310 382 240 332 195 C 302 168 276 155 256 152" stroke="rgba(96,165,250,.35)" stroke-width="22" stroke-linecap="round" fill="none" filter="url(#curveGlow)"/>
  <path d="M 417 390 C 412 310 382 240 332 195 C 302 168 276 155 256 152" stroke="url(#curveRight)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 415 386 C 410 307 380 237 330 192 C 300 165 274 153 256 150" stroke="rgba(255,255,255,.28)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- CAPA 6: PALA fiel a la referencia — teardrop + yoke triangular + handle + agujeros Sapphire -->
  <g transform="translate(256, 268) rotate(-15) translate(-100, -160)">
    <!-- Silueta principal con cutout triangular del yoke (evenodd) -->
    <path fill-rule="evenodd" d="
      M 100 6
      C 152 6 188 40 188 92
      C 188 142 162 173 130 184
      L 130 192
      L 116 214
      L 116 295
      Q 116 308 103 308
      L 97 308
      Q 84 308 84 295
      L 84 214
      L 70 192
      L 70 184
      C 38 173 12 142 12 92
      C 12 40 48 6 100 6
      Z
      M 100 188
      L 86 209
      L 114 209
      Z
    " fill="url(#paddleGrad)"/>

    <!-- Bevel superior derecho (luz) -->
    <path d="M 100 14 C 150 14 180 44 180 92 C 180 132 158 160 130 170"
          stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Sombra borde izquierdo -->
    <path d="M 20 92 C 20 132 42 160 70 170"
          stroke="rgba(30,58,138,.30)" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Triángulo cutout interior (más oscuro = ventana yoke) -->
    <path d="M 100 188 L 86 209 L 114 209 Z" fill="#0e1f4d"/>
    <path d="M 100 188 L 86 209 L 114 209 Z" stroke="rgba(255,255,255,.25)" stroke-width="1" fill="none"/>

    <!-- AGUJEROS Sapphire — patrón hexagonal denso 47 holes -->
    <g fill="#1E3A8A">
      <!-- Fila 1 y=32 -->
      <circle cx="78"  cy="32" r="3.8"/><circle cx="100" cy="32" r="3.8"/><circle cx="122" cy="32" r="3.8"/>
      <!-- Fila 2 y=46 offset -->
      <circle cx="67"  cy="46" r="3.8"/><circle cx="89"  cy="46" r="3.8"/><circle cx="111" cy="46" r="3.8"/><circle cx="133" cy="46" r="3.8"/>
      <!-- Fila 3 y=60 -->
      <circle cx="56"  cy="60" r="3.8"/><circle cx="78"  cy="60" r="3.8"/><circle cx="100" cy="60" r="3.8"/><circle cx="122" cy="60" r="3.8"/><circle cx="144" cy="60" r="3.8"/>
      <!-- Fila 4 y=74 offset -->
      <circle cx="45"  cy="74" r="3.8"/><circle cx="67"  cy="74" r="3.8"/><circle cx="89"  cy="74" r="3.8"/><circle cx="111" cy="74" r="3.8"/><circle cx="133" cy="74" r="3.8"/><circle cx="155" cy="74" r="3.8"/>
      <!-- Fila 5 y=88 (más ancha) -->
      <circle cx="34"  cy="88" r="3.8"/><circle cx="56"  cy="88" r="3.8"/><circle cx="78"  cy="88" r="3.8"/><circle cx="100" cy="88" r="3.8"/><circle cx="122" cy="88" r="3.8"/><circle cx="144" cy="88" r="3.8"/><circle cx="166" cy="88" r="3.8"/>
      <!-- Fila 6 y=102 offset -->
      <circle cx="45"  cy="102" r="3.8"/><circle cx="67"  cy="102" r="3.8"/><circle cx="89"  cy="102" r="3.8"/><circle cx="111" cy="102" r="3.8"/><circle cx="133" cy="102" r="3.8"/><circle cx="155" cy="102" r="3.8"/>
      <!-- Fila 7 y=116 -->
      <circle cx="56"  cy="116" r="3.8"/><circle cx="78"  cy="116" r="3.8"/><circle cx="100" cy="116" r="3.8"/><circle cx="122" cy="116" r="3.8"/><circle cx="144" cy="116" r="3.8"/>
      <!-- Fila 8 y=130 offset -->
      <circle cx="67"  cy="130" r="3.8"/><circle cx="89"  cy="130" r="3.8"/><circle cx="111" cy="130" r="3.8"/><circle cx="133" cy="130" r="3.8"/>
      <!-- Fila 9 y=144 -->
      <circle cx="78"  cy="144" r="3.5"/><circle cx="100" cy="144" r="3.5"/><circle cx="122" cy="144" r="3.5"/>
      <!-- Fila 10 y=158 punta -->
      <circle cx="89"  cy="158" r="3.2"/><circle cx="111" cy="158" r="3.2"/>
    </g>

    <!-- Grip lines en el handle -->
    <line x1="89" y1="232" x2="111" y2="232" stroke="rgba(30,58,138,.55)" stroke-width="1.8"/>
    <line x1="89" y1="244" x2="111" y2="244" stroke="rgba(30,58,138,.55)" stroke-width="1.8"/>
    <line x1="89" y1="256" x2="111" y2="256" stroke="rgba(30,58,138,.55)" stroke-width="1.8"/>
    <line x1="89" y1="268" x2="111" y2="268" stroke="rgba(30,58,138,.5)" stroke-width="1.6"/>
    <line x1="89" y1="280" x2="111" y2="280" stroke="rgba(30,58,138,.45)" stroke-width="1.4"/>

    <!-- Highlight izquierdo handle -->
    <line x1="88" y1="218" x2="88" y2="298" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
  </g>

  <!-- CAPA 7+8: Glare y zona de golpeo -->
  <ellipse cx="158" cy="118" rx="85" ry="55" fill="rgba(255,255,255,.06)" transform="rotate(-25 158 118)"/>
  <ellipse cx="256" cy="206" rx="42" ry="35" fill="rgba(255,255,255,.04)"/>
</svg>
